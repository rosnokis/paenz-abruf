services:
  paenz-sammler:
    build: .
    image: paenz-sammler:1
    container_name: paenz-sammler
    restart: unless-stopped
    env_file: einstellungen.env
    volumes:
      - ./data:/data
    mem_limit: 512m
    # Nur die Rechte, die der Start für chown und den Wechsel zu "node" braucht.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "2m", max-file: "3" }
