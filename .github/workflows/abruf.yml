name: Quellen abrufen

on:
  schedule:
    # Ziel: fertig vor dem Morgenlauf um 06:16 Europe/Berlin (05:16 UTC im Winter).
    # GitHub startet geplante Läufe oft stark verspätet oder gar nicht, deshalb mehrere Termine zu
    # ungeraden Minuten. Der erste, der durchläuft, zählt; spätere am selben Tag brechen sofort ab
    # (Schritt "Heute schon abgerufen?"), die Quellen werden also nur einmal pro Nacht besucht.
    - cron: "17 1 * * *"
    - cron: "23 2 * * *"
    - cron: "11 3 * * *"
    - cron: "41 3 * * *"
    - cron: "7 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quellen-abruf
  cancel-in-progress: false

jobs:
  abruf:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 20

      - name: Heute schon abgerufen?
        id: heute
        run: |
          heute=$(TZ=Europe/Berlin date +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && head -1 out/heute.md | grep -q "^STAND: $heute"; then
            echo "Abruf von heute liegt schon vor, nichts zu tun."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.heute.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Pakete installieren
        if: steps.heute.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Playwright (nur wenn eine Quelle js true hat)
        if: steps.heute.outputs.skip != 'true'
        run: |
          if grep -qE '^\s*js:\s*true' config/quellen.yml; then
            pip install -r requirements-js.txt
            python -m playwright install --with-deps chromium
          else
            echo "Keine JS-Quelle, Playwright wird nicht installiert."
          fi

      - name: Konfiguration prüfen (bei Fehler den letzten gültigen Stand nehmen)
        if: steps.heute.outputs.skip != 'true'
        run: |
          for back in 0 1 2 3 4 5 6 7 8; do
            if [ "$back" != 0 ]; then
              echo "::warning::config ungültig, versuche Stand von vor $back Commit(s)"
              git checkout -q "HEAD~$back" -- config || break
            fi
            if python -m scraper.pflege pruefe; then
              git reset -q -- config   # nur für diesen Lauf, wird nicht committet
              exit 0
            fi
          done
          echo "::error::Keine gültige Konfiguration in den letzten Commits gefunden."
          exit 1

      - name: Quellen abrufen
        if: steps.heute.outputs.skip != 'true'
        run: python -m scraper.main --commit-msg-file "$RUNNER_TEMP/commit-msg.txt"

      - name: Ergebnis committen
        if: steps.heute.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi
          git commit -q -F "$RUNNER_TEMP/commit-msg.txt"
          for i in 1 2 3; do
            git push && exit 0
            sleep $((i * 5))
            git pull --rebase --autostash -q
          done
          exit 1
