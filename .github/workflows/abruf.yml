name: Quellen abrufen

on:
  schedule:
    # 03:30 UTC = 04:30 (Winter) bzw. 05:30 (Sommer) Europe/Berlin, vor dem Morgenlauf um 06:16.
    # Zweiter Termin als Auffangnetz, weil GitHub-Cron ausfallen kann (concurrency verhindert Überschneidung;
    # läuft der erste durch, committet der zweite nur den neuen STAND).
    - cron: "30 3 * * *"
    - cron: "55 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quellen-abruf
  cancel-in-progress: false

jobs:
  abruf:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 20

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Pakete installieren
        run: pip install -r requirements.txt

      - name: Playwright (nur wenn eine Quelle js true hat)
        run: |
          if grep -qE '^\s*js:\s*true' config/quellen.yml; then
            pip install -r requirements-js.txt
            python -m playwright install --with-deps chromium
          else
            echo "Keine JS-Quelle, Playwright wird nicht installiert."
          fi

      - name: Konfiguration prüfen (bei Fehler den letzten gültigen Stand nehmen)
        run: |
          for back in 0 1 2 3 4 5 6 7 8; do
            if [ "$back" != 0 ]; then
              echo "::warning::config ungültig, versuche Stand von vor $back Commit(s)"
              git checkout -q "HEAD~$back" -- config || break
            fi
            if python -m scraper.pflege pruefe; then
              git reset -q -- config   # nur für diesen Lauf, wird nicht committet
              exit 0
            fi
          done
          echo "::error::Keine gültige Konfiguration in den letzten Commits gefunden."
          exit 1

      - name: Quellen abrufen
        run: python -m scraper.main --commit-msg-file "$RUNNER_TEMP/commit-msg.txt"

      - name: Ergebnis committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi
          git commit -q -F "$RUNNER_TEMP/commit-msg.txt"
          for i in 1 2 3; do
            git push && exit 0
            sleep $((i * 5))
            git pull --rebase -q
          done
          exit 1
