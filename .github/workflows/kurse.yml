name: Kurse abrufen

on:
  schedule:
    - cron: "37 14 * * 6"   # samstags, vor dem Wochencheck am Sonntag
  workflow_dispatch:

permissions: {}

concurrency:
  group: quellen-abruf
  cancel-in-progress: false

# Wie abruf.yml: Abruf mit Leserecht, Commit auf einem frischen Runner mit Schreibrecht.
jobs:
  kurse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 20
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.lock
      - name: Pakete installieren (nur mit geprüften Hashes)
        run: pip install --require-hashes -r requirements.lock
      - name: Kursanbieter abrufen
        run: >
          python -m scraper.main --config config/kurse_quellen.yml --ausgabe out/kurse
          --ohne-wetter --ohne-extras --commit-msg-file commit-msg.txt
      - name: Kursliste bauen
        run: python -m scraper.kurse
      - name: Ergebnis übergeben
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kurse
          path: |
            out/kurse/
            commit-msg.txt
          if-no-files-found: error
          retention-days: 3

  commit:
    needs: kurse
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 20
          persist-credentials: false
      - name: Alten Stand von out/kurse/ entfernen
        run: rm -rf out/kurse commit-msg.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kurse
          path: .
      - name: Ergebnis committen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if find out -type l | grep -q .; then echo "::error::Symlink in out/"; exit 1; fi
          git config --local http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A out/kurse
          if git diff --cached --quiet; then echo "Keine Änderungen."; exit 0; fi
          sed -i 's/^Abruf/Kurse/' commit-msg.txt
          git -c core.hooksPath=/dev/null commit -q -F commit-msg.txt
          for i in 1 2 3; do
            git -c core.hooksPath=/dev/null push && exit 0
            sleep $((i * 5))
            git -c core.hooksPath=/dev/null pull --rebase --autostash -q
          done
          exit 1
