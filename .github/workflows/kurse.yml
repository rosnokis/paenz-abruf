name: Kurse abrufen

on:
  schedule:
    - cron: "37 14 * * 6"   # samstags, vor dem Wochencheck am Sonntag
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quellen-abruf
  cancel-in-progress: false

jobs:
  kurse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 20
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Pakete installieren
        run: pip install -r requirements.txt
      - name: Kursanbieter abrufen
        run: >
          python -m scraper.main --config config/kurse_quellen.yml --ausgabe out/kurse
          --ohne-wetter --ohne-extras --commit-msg-file "$RUNNER_TEMP/commit-msg.txt"
      - name: Kursliste bauen
        run: python -m scraper.kurse
      - name: Ergebnis committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out/kurse
          if git diff --cached --quiet; then echo "Keine Änderungen."; exit 0; fi
          sed -i 's/^Abruf/Kurse/' "$RUNNER_TEMP/commit-msg.txt"
          git commit -q -F "$RUNNER_TEMP/commit-msg.txt"
          for i in 1 2 3; do
            git push && exit 0
            sleep $((i * 5))
            git pull --rebase --autostash -q
          done
          exit 1
